name: Test & Deploy

# Pushes to master deploy to the live site. Pull requests get their own
# temporary preview URL, which is genuinely useful here because the app is
# tested on a real iPhone — you can try a branch without disturbing the
# installed PWA.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer commit supersedes an in-flight run for the same ref. Never cancel a
# live deploy mid-flight, though.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Node 22+: the e2e scripts drive Chrome over the DevTools Protocol using
      # the global WebSocket, which only exists from Node 22 (it failed on 20
      # with "WebSocket is not defined"). Node 20 is also being deprecated on
      # the runners.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Vue build's `prebuild` hook compiles the Rust to WASM, so the
      # deployed WASM can never be stale relative to the Rust source.
      - name: Install Rust (with wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Caches ~/.cargo and rust/target. Without this every run recompiles
      # tract + the ONNX stack, which dominates the build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # The Rust integration tests read the real tune index from
      # app/public/res/ (it is gitignored — far too large to commit), so it has
      # to be fetched before `cargo test`. It is removed again before the app
      # build; see "Drop the tune index" below.
      - name: Download tune index
        working-directory: app
        run: bash download_tune_data.sh

      # --release because these run full queries over a 42 MB index; in debug
      # the NW alignment pass is slow enough to dominate the job.
      #
      # The audio_* tests skip themselves while their WAV fixture is absent (see
      # rust/wavs/README.md), so no --skip filter is needed here: each one comes
      # back automatically as soon as its clip is restored.
      - name: Rust tests
        working-directory: rust
        run: cargo test --release

      - name: JS unit tests
        working-directory: app
        run: npm test

      # In production the app fetches tune data from folkfriend-data.web.app,
      # so the copies in public/res/ are dead weight in the deployed bundle —
      # they were adding ~42 MB to every deploy, and are now ~87 MB across the
      # per-dataset files and the legacy bundle.
      #
      # nud-meta.json and datasets.json MUST stay: both are small and
      # datasets.json is what the app reads to find the datasets at all. Never
      # exclude res/ wholesale.
      #
      # Moved aside rather than deleted: test/e2e/recovery.mjs serves them from
      # a local stand-in for the CDN, so the e2e step below still needs copies.
      - name: Drop the tune data from the deployed bundle
        run: |
          mkdir -p /tmp/ff-index/res
          for f in folkfriend-non-user-data.json thesession.json \
                   folkwiki.json norbeck.json; do
            mv "app/public/res/$f" /tmp/ff-index/res/ || true
          done
          mv /tmp/ff-index/res/folkfriend-non-user-data.json /tmp/ff-index/ || true
          ls -la /tmp/ff-index /tmp/ff-index/res || true

      # Only the build needs wasm-pack (via the prebuild hook), so install it
      # here rather than up front — a flake fetching it then blocked the tests
      # from running at all. Retried because the installer pulls its tarball
      # from GitHub's release CDN, which resets connections often enough to
      # matter (curl: (35) Recv failure).
      #
      # NB: `curl ... | sh` would mask a failed download — the pipeline's exit
      # status is sh's, and sh happily succeeds on empty input. Download first,
      # then run.
      - name: Install wasm-pack
        run: |
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/wasm-pack-init.sh \
                 https://rustwasm.github.io/wasm-pack/installer/init.sh \
               && sh /tmp/wasm-pack-init.sh; then
              wasm-pack --version && exit 0
            fi
            echo "wasm-pack install attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "wasm-pack install failed after 3 attempts"
          exit 1

      # public/soundfont/ is gitignored, so a fresh clone has no soundfont at
      # all. Without this step the build emits a dist/ with no soundfont/ dir,
      # every note 404s, Firebase's SPA rewrite answers with index.html at
      # status 200, and ABCJS fails decoding a web page as an MP3 — playback is
      # dead on the deployed site while working perfectly on any machine that
      # ran the script once by hand. Verified below, because a 200 that is
      # secretly HTML is exactly the failure a plain fetch cannot see.
      - name: Download soundfont
        working-directory: app
        run: bash download_soundfont.sh

      - name: Build
        working-directory: app
        run: npm run build

      # Guards the failure above. Checks the files reached dist/ *and* that each
      # one is really an MP3 — a truncated or HTML-bodied download would
      # otherwise sail through and only surface as silent playback in the app.
      - name: Verify soundfont shipped in the build
        working-directory: app
        run: |
          dir=dist/soundfont/acoustic_grand_piano-mp3
          count=$(ls "$dir"/*.mp3 2>/dev/null | wc -l)
          if [ "$count" -ne 88 ]; then
            echo "expected 88 soundfont notes in $dir, found $count"
            exit 1
          fi
          for f in "$dir"/*.mp3; do
            if ! file -b "$f" | grep -qi 'audio\|mpeg'; then
              echo "$f is not an MP3: $(file -b "$f")"
              exit 1
            fi
          done
          echo "soundfont OK: $count notes"

      # The WASM module is the app's executable: without it there is no
      # transcription, no query engine, and the saved tune index is unreadable.
      # Workbox silently drops anything over 2 MiB from the precache manifest
      # and says so only in a build-log line nobody reads, so every deploy
      # shipped a service worker with no WASM in it — and the offline tests
      # still passed, because Chrome's HTTP cache was quietly covering for it.
      #
      # Same rule as the soundfont check above: an asset that is required by the
      # deployed app needs a post-build assertion, not a config option that is
      # assumed to have worked.
      - name: Verify the WASM is in the service worker precache
        working-directory: app
        run: |
          # No `ls` on globs here. Under `bash -e`, `ls a b*` returns 2 when the
          # b* pattern matches nothing even though it listed `a` perfectly well,
          # which kills the step — and with 2>/dev/null attached, silently.
          wasm=""
          for f in dist/*.wasm; do
            [ -f "$f" ] && wasm="$f" && break
          done
          if [ -z "$wasm" ]; then
            echo "no .wasm emitted into dist/ — the build is broken"
            exit 1
          fi
          name=$(basename "$wasm")

          # Workbox 6 inlines the manifest into service-worker.js; older majors
          # emitted precache-manifest.*.js. Search whichever exist.
          manifests=""
          for f in dist/service-worker.js dist/precache-manifest*.js; do
            [ -f "$f" ] && manifests="$manifests $f"
          done
          if [ -z "$manifests" ]; then
            echo "no service worker emitted into dist/"
            exit 1
          fi

          if ! grep -qF "$name" $manifests; then
            echo "$name is NOT in the precache manifest ($manifests)."
            echo "Workbox almost certainly skipped it for size — check"
            echo "maximumFileSizeToCacheInBytes in vue.config.js against:"
            ls -l "$wasm"
            exit 1
          fi
          echo "precache OK: $name ($(du -h "$wasm" | cut -f1)) in$manifests"

          # No tune data may be precached — it lives in IndexedDB, and a second
          # copy in CacheStorage roughly doubles the chance the browser evicts
          # the one that makes the app work offline.
          #
          # This used to check only folkfriend-non-user-data.json, and relied on
          # maximumFileSizeToCacheInBytes to keep it out. That reasoning was
          # "smaller than the smallest dataset", and the smallest is now ~3 MB —
          # well under the 20 MB limit. vue.config.js excludes them by name;
          # this is the assertion that it worked.
          for data in datasets.json thesession.json folkwiki.json \
                      norbeck.json folkfriend-non-user-data.json; do
            if grep -qF "$data" $manifests; then
              echo "$data is in the precache manifest — it must not be"
              exit 1
            fi
          done
          echo "precache OK: no tune data is precached"

          # ...but datasets.json and nud-meta.json must still be SERVED. A 404
          # on nud-meta.json fails the service worker install outright.
          for required in res/nud-meta.json; do
            if [ ! -f "dist/$required" ]; then
              echo "dist/$required is missing — never exclude res/ wholesale"
              exit 1
            fi
          done

      - name: Report bundle size
        working-directory: app
        run: du -sh dist && du -sh dist/* | sort -h | tail -5

      # The offline tests need the production build (they exercise the service
      # worker) served over http, plus a real Chrome.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Serve the production build
        working-directory: app
        run: |
          npx serve dist -s -l 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "dev server never came up"; exit 1

      - name: Offline / PWA end-to-end tests
        working-directory: app
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # recovery.mjs stands in for the tune-data CDN, so it needs the data
          # the build step moved out of public/res/. It prefers the per-dataset
          # files and falls back to the merged one.
          FF_INDEX_JSON: /tmp/ff-index/folkfriend-non-user-data.json
          FF_RES_DIR: /tmp/ff-index/res
        run: npm run test:e2e

      # Preview channel for PRs: a temporary URL that expires after 7 days.
      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: folkfriend-petrush-fork
          entryPoint: ./app
          expires: 7d

      - name: Deploy live (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: folkfriend-petrush-fork
          entryPoint: ./app
          channelId: live
